<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MODULES = (() => { try { const m = JSON.parse(localStorage.getItem('studio-prototype.modules.v1') || localStorage.getItem('studio-prototype.modules')); if (Array.isArray(m) && m.length) return m; } catch (e) {}
    return [{ id: 'application', name: 'Application', primary: true }, { id: 'renewal', name: 'Renewal', primaryStates: ['Manual Expired', 'Auto Expired', 'Due for Renewal'], secondaryStates: [] },
      { id: 'amendment', name: 'Amendment', primaryStates: ['Approved'], secondaryStates: [] }]; })();
  const SAMPLE = () => ({
    states: [
      { id: 's1', type: 'start', name: 'Applied', description: 'A citizen has filed an application.', slaHours: 24, notify: { enabled: true, items: [{ name: 'Application received', channel: 'SMS' }] } },
      { id: 's2', type: 'intermediate', name: 'Pending verification', description: 'A verifier checks the application details.', slaHours: 48, notify: { enabled: true, items: [{ name: 'Application under verification', channel: 'SMS' }] } },
      { id: 's3', type: 'intermediate', name: 'Pending approval', description: 'An approver reviews the verified application.', slaHours: 72, notify: { enabled: false, items: [] } },
      { id: 's4', type: 'end', name: 'Approved', description: 'The application is approved.', slaHours: 0, notify: { enabled: true, items: [{ name: 'Application approved', channel: 'Email' }] } },
      { id: 's5', type: 'end', name: 'Rejected', description: 'The application is rejected.', slaHours: 0, notify: { enabled: true, items: [{ name: 'Application rejected', channel: 'SMS' }] } },
    ],
    actions: [
      { name: 'Submit', from: 's1', to: 's2', roles: ['CITIZEN'] }, { name: 'Verify', from: 's2', to: 's3', roles: ['VERIFIER'] }, { name: 'Send back', from: 's2', to: 's1', roles: ['VERIFIER'] },
      { name: 'Approve', from: 's3', to: 's4', roles: ['APPROVER'] }, { name: 'Reject', from: 's3', to: 's5', roles: ['APPROVER'] },
    ],
  });
  const flowOf = m => { try { const f = JSON.parse(localStorage.getItem('studio-process-flow.' + m.id)); if (f && f.states && f.states.length) return f; } catch (e) {} return SAMPLE(); };
  const roleName = r => r.charAt(0) + r.slice(1).toLowerCase().replace(/_/g, ' ');
  const hrs = h => (h >= 24 && h % 24 === 0 ? `${h / 24} ${h / 24 === 1 ? 'day' : 'days'}` : `${h} ${h === 1 ? 'hour' : 'hours'}`);
  const notesOf = s => (s.notify && s.notify.enabled ? s.notify.items || [] : []);
  function ordered(f) {
    const seen = new Set(), out = [], q = f.states.filter(s => s.type === 'start').map(s => s.id);
    while (q.length) { const id = q.shift(); if (seen.has(id)) continue; seen.add(id); const s = f.states.find(x => x.id === id); if (!s) continue; out.push(s); f.actions.filter(a => a.from === id).forEach(a => { if (!seen.has(a.to)) q.push(a.to); }); }
    f.states.forEach(s => { if (!seen.has(s.id)) out.push(s); });
    return [...out.filter(s => s.type !== 'end'), ...out.filter(s => s.type === 'end')];
  }
  function pathTo(f, target) {
    const start = f.states.find(s => s.type === 'start'); if (!start) return [target];
    const prev = { [start.id]: null }, q = [start.id];
    while (q.length) { const id = q.shift(); if (id === target.id) break; f.actions.filter(a => a.from === id).forEach(a => { if (!(a.to in prev)) { prev[a.to] = id; q.push(a.to); } }); }
    if (!(target.id in prev)) return [start, target];
    const p = []; let cur = target.id; while (cur) { p.unshift(f.states.find(s => s.id === cur)); cur = prev[cur]; } return p;
  }

  const PLACEHOLDER = true;   // for now the window is empty (Mobile / Tablet / Laptop still switch its size); set to false to bring the app back
  let mod = MODULES[0], role = 'CITIZEN', stepId = null, device = 'mobile';
  const BELL = n => `<span class="pv-bell" aria-label="${n} new notification${n === 1 ? '' : 's'}"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" fill="#363636"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0" stroke="#363636" stroke-width="2" fill="none" stroke-linecap="round"/></svg>${n ? `<b>${n}</b>` : ''}</span>`;
  (() => { let t = null; try { t = JSON.parse(localStorage.getItem('studio-brand')).theme; } catch (e) {} if (!t) { try { t = JSON.parse(localStorage.getItem('digit-console-v4')).account.branding.theme; } catch (e) {} }
    const r = { sharp: '2px', rounded: '6px', soft: '10px', pill: '999px' }[t && t.radius]; if (r) document.documentElement.style.setProperty('--pv-rb', r); })();
  const DEVICES = [
    ['mobile', 'Mobile', '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2" stroke-linecap="round"/></svg>'],
    ['tablet', 'Tablet', '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M11 18h2" stroke-linecap="round"/></svg>'],
    ['laptop', 'Laptop', '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="16" height="11" rx="1.5"/><path d="M2 19h20" stroke-linecap="round"/></svg>'],
  ];
  const CHECK = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const ACCESS = { CREATOR: ['Create', 'pv-tg-create'], EDITOR: ['Edit', 'pv-tg-edit'], VIEWER: ['View', 'pv-tg-view'] };
  const ROLES_PAGE = (() => { try { const r = JSON.parse(localStorage.getItem('studio-prototype.roles.v1')); return Array.isArray(r) ? r : []; } catch (e) { return []; } })();
  const nameOf = c => (ROLES_PAGE.find(x => x.code === c) || {}).name || roleName(c);   // the name as written on the Roles page
  // same as the role tiles on the Roles page: soft tint + person icon
  const ROLE_TINTS = ['#FAF5F0', '#EEF5F7', '#F3F4FC', '#EFF7F0'];
  const USER_ICON = '<svg aria-hidden="true" focusable="false" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>';
  const MOD_ICON = '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>';

  const FLAG_ICON = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/></svg>';
  const BELL_ICON = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  let popOpen = false, unread = 0, pick = 0;   // pick = the chosen option in the card
  const ARROW = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const whereOf = r => r === 'CITIZEN' ? 'the citizen’s application tracker on Mobile' : `the ${nameOf(r)}’s inbox on Laptop`;
  // One event per move. nexts = this module's next actions + every module this state activates
  // (activation states are set on each module in the Studio). Actions are grouped by the role who does them.
  const fallbackRole = g => g.actions.flatMap(a => a.roles || []).find(x => x !== 'CITIZEN') || ROLES_PAGE[0]?.code || 'VERIFIER';
  function groupsOf(g, stId) {
    const by = new Map();
    g.actions.filter(a => a.from === stId).forEach(a => (a.roles && a.roles.length ? a.roles : [fallbackRole(g)]).forEach(r => {
      if (!by.has(r)) by.set(r, []); by.get(r).push(a.name.trim().toLowerCase()); }));
    return [...by].map(([role, acts]) => ({ role, acts }));
  }
  function stepEvent(f, toId, actor, action) {
    const to = f.states.find(x => x.id === toId); if (!to) return null;
    const nexts = [];
    if (to.type === 'end') nexts.push({ modId: mod.id, toId, end: true, groups: [{ role: 'CITIZEN', acts: ['see the result'] }] });
    else { const gs = groupsOf(f, to.id); if (gs.length) nexts.push({ modId: mod.id, toId, groups: gs }); }
    const same = x => String(x).trim().toLowerCase() === to.name.trim().toLowerCase();
    MODULES.filter(m => m.id !== mod.id && [...(m.primaryStates || []), ...(m.secondaryStates || [])].some(same)).forEach(m => {
      const g = flowOf(m), st = g.states.find(x => x.type === 'start') || g.states[0], gs = groupsOf(g, st.id);
      nexts.push({ modId: m.id, toId: st.id, fresh: true, groups: gs.length ? gs : [{ role: 'CITIZEN', acts: ['apply'] }] });
    });
    return { actor, did: pastOf(action), modId: mod.id, module: mod.name, state: to.name, title: `${actor} ${pastOf(action)}`, nexts, current: true, at: Date.now() };
  }
  function notify(n) {
    if (!n || !n.nexts.length) return;
        notes.unshift({ ...n, current: true, at: Date.now() }); drawNote();
    const b = $('pv-bb'); b.classList.remove('is-ring'); void b.offsetWidth; b.classList.add('is-ring');
    $('pv-bb-live').textContent = ''; setTimeout(() => { $('pv-bb-live').textContent = `What happens now? The application is now in ${n.state}.`; }, 40);
  }
  function drawNote() {
    const pop = $('pv-pop'), btn = $('pv-bb'), c = $('pv-bb-n');
    const top = notes.find(x => x.current);   // the card shown: one line here + one in another module
    unread = top ? (top.nexts.some(x => x.modId === top.modId) ? 3 : 0) + (top.nexts.some(x => x.modId !== top.modId) ? 1 : 0) : 0;
    c.hidden = !unread; c.textContent = unread;
    btn.classList.toggle('has-new', !!unread);
    btn.setAttribute('aria-expanded', String(popOpen));
    btn.setAttribute('aria-label', unread ? `What happens now? ${unread} new` : 'What happens now?');
    pop.hidden = !popOpen; if (!popOpen) return;
    const cur = notes.find(x => x.current);   // newest update not acted on
    pop.innerHTML = `<div class="pv-pop-top"><div class="pv-pop-head"><h2 class="pv-pop-t" id="pv-pop-t" tabindex="-1">What happens now?</h2>
        <button type="button" class="pv-pop-x" data-note="close" aria-label="Close"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#363636" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <p class="pv-pop-sub">Based on the process flow you set up for this service.</p></div>
      ${!cur ? `<div class="pv-pop-empty">
          <span class="pv-pop-art" aria-hidden="true">${$('pv-bb').querySelector('svg').outerHTML}</span>
          <p class="pv-pop-et">No role to switch to yet</p>
          <p class="pv-pop-ed">When an application moves to the next step, you’ll see who has to act on it and where to go.</p></div>`
      : notes.filter(x => x.current).slice(0, 1).map(n => {   // one card for now: the newest
          // placeholder names, numbered in the order they appear: Role 1 / Action 1 = what was done
          const T = (c, t) => `<span class="pv-tag-${c}">${t}</span>`;
          const ids = { role: new Map([[n.actor, 1]]), mod: new Map([[n.modId, 1]]) }; let act = 1;
          const R = r => T('role', `Role ${ids.role.get(r) || (ids.role.set(r, ids.role.size + 1), ids.role.size)}`);
          const Mo = m => T('mod', `Module ${ids.mod.get(m) || (ids.mod.set(m, ids.mod.size + 1), ids.mod.size)}`);
          const A = () => T('act', `Action ${++act}`);
          const or = xs => xs.length < 3 ? xs.join(' or ') : xs.slice(0, -1).join(', ') + ' or ' + xs[xs.length - 1];
          // two for now: this module + another module this state starts; fixed license wording, each button names where it goes
          const sameK = n.nexts.findIndex(x => x.modId === n.modId), otherK = n.nexts.findIndex(x => x.modId !== n.modId);
          const items = [];
          // one card per action (action names are unique in a state); each says which state it moves the application to
          // only roles and states are tags; actions and modules are bold text. Each card's button names the role it switches to.
          const B = t => t;   // plain text: only the tags stand out
          // one card per role + action: one plain sentence each (no bullet points), with the state it moves the application to
          const S = (r, act, to) => `${T('role', r)} can ${T('act', act)} to move the application to <b>${to}</b> in <b>New License</b>`;   // state and module bold in the choices
          if (sameK > -1) {   // any one of these finishes this state
            const g2 = n.nexts[sameK].groups.length > 1 ? 1 : 0;
            items.push({ k: sameK, g: 0, to: 'License Verifier', text: S('License Verifier', 'Verify', 'Pending approval') });
            items.push({ k: sameK, g: 0, to: 'License Verifier', text: S('License Verifier', 'Send back', 'Citizen correction') });
            items.push({ k: sameK, g: g2, to: 'License Inspector', text: S('License Inspector', 'Send back', 'Citizen correction') });
          }
          if (otherK > -1) items.push({ k: otherK, g: 0, to: 'Citizen in Renewal',   // another module: the module is a (neutral) tag
            text: `${T('role', 'Citizen')} can ${T('act', 'Apply')} to start ${T('mod', 'Renewal')}` });
          const opts = items.map(it => `<li class="pv-opt">
              <p class="pv-up-s">${it.text}</p>
              <button type="button" class="pv-opt-go" data-note="go" data-i="${notes.indexOf(n)}" data-k="${it.k}" data-g="${it.g}">Switch to ${it.to}${ARROW}</button></li>`).join('');
          return `<div class="pv-up">
          <p class="pv-up-s pv-up-what">Citizen completed Apply in New License. The application is now in Pending verification.</p>
          <ul class="pv-opts" aria-label="Where to go">${opts}</ul>
        </div>`; }).join('<hr class="pv-up-sep">')}`;
  }
  const setPop = (on, focusPanel) => { popOpen = on; drawNote(); if (on && focusPanel) ($('pv-pop').querySelector('.pv-opt-go') || $('pv-pop-t')).focus(); };
  $('pv-bb').addEventListener('click', () => setPop(!popOpen, true));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && popOpen && !$('pv-exit').open) { setPop(false); $('pv-bb').focus(); } });
  document.addEventListener('pointerdown', e => { if (popOpen && !e.target.closest('.pv-bw')) setPop(false); });
  $('pv-pop').addEventListener('click', e => {
    const b = e.target.closest('[data-note]'); if (!b) return; const n = notes[+b.dataset.i], x = n && n.nexts[+b.dataset.k];
    if (b.dataset.note === 'go' && x) {
      if (x.modId !== mod.id) { mod = MODULES.find(m => m.id === x.modId) || mod; stepId = x.toId; submitted = !x.fresh; page = 0; errs = {}; if (x.fresh) values = {}; }
      const g = x.groups[+b.dataset.g] || x.groups[0];
      pick = 0; x.groups = []; n.nexts = n.nexts.filter(y => y.groups.length); if (!n.nexts.length) notes = notes.filter(y => y !== n);
      role = g.role; device = role === 'CITIZEN' ? 'mobile' : 'laptop'; empView = 'inbox'; empNote = '';
      if (role === 'CITIZEN') screen = x.fresh ? 'landing' : 'track';
      popOpen = false; draw(); document.querySelector(`[data-role="${role}"]`)?.focus();
    } else { setPop(false); $('pv-bb').focus(); }
  });
  const draw = () => { drawPanels(); drawPreview(); drawNote(); };
  $('pv-exit-cancel').addEventListener('click', () => $('pv-exit').close());
  $('pv-exit-ok').addEventListener('click', () => { location.href = 'index.html'; });
  $('pv-exit').addEventListener('click', e => { if (e.target === $('pv-exit')) $('pv-exit').close(); });
  $('pv-exit').addEventListener('close', () => $('pv-back').focus());
  document.addEventListener('click', e => {
    const d = e.target.closest('[data-dev]'); if (d) { device = d.dataset.dev; drawPreview(); document.querySelector(`[data-dev="${device}"]`).focus(); return; }
    if (e.target.closest('#pv-back')) { $('pv-exit').showModal(); $('pv-exit-cancel').focus(); }
  });
  // radio groups: arrow keys move the choice
  document.addEventListener('keydown', e => {
    const k = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key]; if (!k) return;
    const g = e.target.closest('.pv-seg'); if (!g) return; e.preventDefault();
    const items = [...g.querySelectorAll('[role=radio]')], i = items.indexOf(e.target); const n = items[(i + k + items.length) % items.length]; n.click();
  });
  $('pv-mods').addEventListener('click', e => { const b = e.target.closest('[data-mod]'); if (!b) return; mod = MODULES.find(x => x.id === b.dataset.mod); stepId = null; notes.forEach(n => { n.nexts = n.nexts.filter(x => x.modId !== mod.id); }); notes = notes.filter(n => n.nexts.length); unread = 0; screen = 'landing'; page = 0; errs = {}; values = {}; empView = 'inbox'; empNote = ''; role = 'CITIZEN'; device = 'mobile'; landApplied(); draw(); document.querySelector(`[data-mod="${b.dataset.mod}"]`).focus(); });
  $('pv-roles').addEventListener('change', e => { const r = e.target.dataset.role; if (!r) return; role = r; notes.forEach(n => { n.nexts.forEach(x => { if (x.modId === mod.id) x.groups = x.groups.filter(g => g.role !== r); }); n.nexts = n.nexts.filter(x => x.groups.length); }); notes = notes.filter(n => n.nexts.length);   // went there: that update is done
    device = role === 'CITIZEN' ? 'mobile' : 'laptop'; empView = 'inbox'; empNote = ''; draw(); document.querySelector(`[data-role="${r}"]`).focus(); });
  // Landing: assume the citizen has already applied, so the first thing you see is the update
  function landApplied() {
    const f = flowOf(mod), start = f.states.find(x => x.type === 'start') || f.states[0];
    const to = f.actions.find(a => a.from === start.id)?.to || f.states.find(x => x.id !== start.id && x.type !== 'end')?.id || start.id;
    formOf(mod).forEach(sec => sec.fields.forEach(fl => { values[fl.id] = sampleFor(fl); }));
    stepId = to; submitted = true; screen = 'landing';
    const ev = stepEvent(f, stepId, 'CITIZEN', f.actions.find(a => a.from === start.id)?.name || 'Apply');
    const here = ev && ev.nexts.find(x => x.modId === mod.id);
    if (here && here.groups.length < 2) {   // showcase: one action, several roles
      const used = new Set(here.groups.map(g => g.role));
      const more = [...new Set([...ROLES_PAGE.map(x => x.code), ...f.actions.flatMap(a => a.roles || [])])].find(r => r && r !== 'CITIZEN' && !used.has(r)) || 'INSPECTOR';
      here.groups.push({ role: more, acts: [here.groups[0].acts[0]] });
    }
    if (ev && !ev.nexts.some(x => x.modId !== mod.id)) {   // showcase: this state also starts another module
      const m = MODULES.find(x => /renew/i.test(x.name) && x.id !== mod.id) || MODULES.find(x => x.id !== mod.id);
      if (m) { const g = flowOf(m), st = g.states.find(x => x.type === 'start') || g.states[0], gs = groupsOf(g, st.id);
        ev.nexts.push({ modId: m.id, toId: st.id, fresh: true, groups: gs.length ? gs : [{ role: 'CITIZEN', acts: ['apply'] }] }); }
    }
    notify(ev); popOpen = true;
  }
  landApplied();
  draw();
})();
